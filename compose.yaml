services:
  eos-pv-helper:
    build:
      context: .
      target: eos-source
    image: eos-pv-helper:local
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./input:/input:ro
      - ./output:/output
    mem_limit: 512m
    cpus: 0.25
    # No published ports, Docker socket, privileged mode, or device mounts.
    # Default command is dry-run. Do not add --write-eos before explicit approval.
