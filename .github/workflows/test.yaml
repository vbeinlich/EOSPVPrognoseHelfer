name: Tests and container publishing
on:
  push:
    branches: [main, feat/issue-1-pv-normalization]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install '.[test]'
      - run: ruff check src tests scripts
      - run: pytest -q
      - run: docker compose config --no-path-resolution
      - run: docker build --target eos-source -t eos-pv-helper:ci .
      - run: python scripts/unraid_smoke.py --image eos-pv-helper:ci
      - name: Export candidate license inventory for review
        run: |
          docker run --rm --network none --entrypoint cat eos-pv-helper:ci /usr/share/eos-pv-helper/licenses/inventory.json > candidate-license-inventory.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-license-inventory-${{ github.sha }}
          path: candidate-license-inventory.json
  eos-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require real acceptance and merged main history before a stable build
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          accepted_revision=$(python scripts/release_gate.py)
          git merge-base --is-ancestor "$accepted_revision" HEAD
          git merge-base --is-ancestor HEAD origin/main
          test "$(gh api repos/vbeinlich/EOSPVPrognoseHelfer/issues/1 --jq .state)" = closed
      - run: docker build -f tests/integration/Dockerfile -t eos-pv-helper:eos-test .
      - run: docker run --rm --network none eos-pv-helper:eos-test
  publish:
    # No publishing from fork PRs or pull_request merge refs.
    if: github.event_name == 'push'
    needs: [unit, eos-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Derive lowercase commit and preview/release tags
        id: meta
        run: python scripts/image_metadata.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish tested EOS-source image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: eos-source
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/vbeinlich/EOSPVPrognoseHelfer
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=eos-source
          cache-to: type=gha,mode=max,scope=eos-source
      - name: Record digest and source revision
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('image-metadata.json')
          record = json.loads(path.read_text())
          record['digest'] = os.environ['IMAGE_DIGEST']
          record['pinned_image'] = record['image'] + '@' + record['digest']
          path.write_text(json.dumps(record, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Image: `' + record['pinned_image'] + '`\n\n')
              summary.write('Source: `' + record['revision'] + '`\n\n')
              summary.write('If anonymous pull fails, set the GHCR package visibility to Public.\n')
          PY
      - name: Verify anonymous pull with an empty Docker credential directory
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          anonymous_config=$(mktemp -d)
          docker --config "$anonymous_config" pull "ghcr.io/vbeinlich/eospvprognosehelfer@$IMAGE_DIGEST"
      - name: Smoke-test the actual registry image without network access
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python scripts/unraid_smoke.py --image "ghcr.io/vbeinlich/eospvprognosehelfer@$IMAGE_DIGEST" --revision "$GITHUB_SHA"
      - name: Promote only the verified registry digest to stable tags
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PROMOTION_TAGS: ${{ steps.meta.outputs.promotion_tags }}
        run: |
          image="ghcr.io/vbeinlich/eospvprognosehelfer@$IMAGE_DIGEST"
          docker run --rm --network none --entrypoint cat "$image" /usr/share/eos-pv-helper/licenses/inventory.json > release-license-inventory.json
          python scripts/release_gate.py --inventory release-license-inventory.json
          tags=()
          for tag in $PROMOTION_TAGS; do tags+=(--tag "$tag"); done
          # Version tags are immutable. Do not move an existing version to a new digest.
          for tag in $PROMOTION_TAGS; do
            if [[ "$tag" != *:latest ]]; then
              if existing=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}' 2>version-inspect-error); then
                test "$existing" = "$IMAGE_DIGEST"
              elif ! grep -Fq "$tag: not found" version-inspect-error; then
                # Network/auth/registry errors do not prove that a version is absent.
                cat version-inspect-error >&2
                exit 1
              fi
            fi
          done
          docker buildx imagetools create --prefer-index=false "${tags[@]}" "$image"
          for tag in $PROMOTION_TAGS; do
            test "$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')" = "$IMAGE_DIGEST"
          done
      - name: Save verifiable publication metadata (also on public-access failure)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-publication-${{ github.sha }}
          path: image-metadata.json
          if-no-files-found: error
