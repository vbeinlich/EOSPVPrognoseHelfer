name: Tests and candidate inspection (no image publication)
on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      PYTEST_ADDOPTS: '-m "not genetic_execution"'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: pip install '.[test]'
      - run: ruff check src tests scripts
      - run: pytest -q
      - name: Read immutable old image for read-only inspector compatibility
        run: docker pull ghcr.io/vbeinlich/eospvprognosehelfer@sha256:7e957da3e2fdb67456a46e5538ad3c74b43fa21892d2998e93bca9de83d9daf7
      - name: Test old-container bundle without installed helper modules
        run: python scripts/plan_inspector_smoke.py --docker-context default --image ghcr.io/vbeinlich/eospvprognosehelfer@sha256:7e957da3e2fdb67456a46e5538ad3c74b43fa21892d2998e93bca9de83d9daf7 --html "$RUNNER_TEMP/plan-inspector-synthetic.html"
      - name: Test real static browser view without a webserver
        run: node scripts/plan_ui_smoke.mjs --browser "$(command -v google-chrome || command -v chromium)" --html "$RUNNER_TEMP/plan-inspector-synthetic.html"
      - run: docker compose config --no-path-resolution
      - run: docker build --target eos-source -t eos-pv-helper:ci .
      - run: python scripts/unraid_smoke.py --image eos-pv-helper:ci
      - name: Export candidate license inventory for review
        run: |
          docker run --rm --network none --entrypoint cat eos-pv-helper:ci /usr/share/eos-pv-helper/licenses/inventory.json > candidate-license-inventory.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-license-inventory-${{ github.sha }}
          path: candidate-license-inventory.json
  eos-integration:
    runs-on: ubuntu-latest
    env:
      PYTEST_ADDOPTS: '-m "not genetic_execution"'
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: docker build -f tests/integration/Dockerfile -t eos-pv-helper:eos-test .
      - run: docker run --rm --network none -e PYTEST_ADDOPTS eos-pv-helper:eos-test
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Native forward comparison only, read-only sources and isolated temporary configuration
        run: |
          set -o noclobber
          docker run --rm --network none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --tmpfs /tmp:rw,exec,nosuid,nodev \
            --tmpfs /tmp/eos-test:rw,nosuid,nodev \
            --entrypoint python eos-pv-helper:eos-test \
            scripts/economics_smoke.py --html - > "$RUNNER_TEMP/economics-synthetic.html"
      - name: Browser-check calculated economics, slot costs and end-SoC fairness
        run: node scripts/plan_ui_smoke.mjs --browser "$(command -v google-chrome || command -v chromium)" --html "$RUNNER_TEMP/economics-synthetic.html" --economic
