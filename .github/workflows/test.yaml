name: Tests and candidate inspection (no image publication)
on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      # Explicit operator boundary: this preparation must not start GENETIC.
      PYTEST_ADDOPTS: ${{ (github.head_ref == 'release/v0.1.0-final-gates' || github.ref_name == 'release/v0.1.0-final-gates' || github.head_ref == 'release/v0.1.0-doctor-review' || github.ref_name == 'release/v0.1.0-doctor-review') && '-m "not genetic_execution"' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install '.[test]'
      - run: ruff check src tests scripts
      - run: pytest -q
      - run: docker compose config --no-path-resolution
      - run: docker build --target eos-source -t eos-pv-helper:ci .
      - run: python scripts/unraid_smoke.py --image eos-pv-helper:ci
      - name: Export candidate license inventory for review
        run: |
          docker run --rm --network none --entrypoint cat eos-pv-helper:ci /usr/share/eos-pv-helper/licenses/inventory.json > candidate-license-inventory.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-license-inventory-${{ github.sha }}
          path: candidate-license-inventory.json
  eos-integration:
    runs-on: ubuntu-latest
    env:
      PYTEST_ADDOPTS: ${{ (github.head_ref == 'release/v0.1.0-final-gates' || github.ref_name == 'release/v0.1.0-final-gates' || github.head_ref == 'release/v0.1.0-doctor-review' || github.ref_name == 'release/v0.1.0-doctor-review') && '-m "not genetic_execution"' || '' }}
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: docker build -f tests/integration/Dockerfile -t eos-pv-helper:eos-test .
      - run: docker run --rm --network none -e PYTEST_ADDOPTS eos-pv-helper:eos-test
