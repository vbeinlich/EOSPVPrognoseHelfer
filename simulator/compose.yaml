name: ems-maxxicharge-poc
services:
  ems-maxxicharge-simulator:
    build:
      context: ..
      dockerfile: simulator/Dockerfile
      network: none
    image: ems-maxxicharge-simulator:poc-local
    network_mode: none
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 384m
    cpus: 0.5
    restart: 'no'
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
    command: [--input, /input/input.json, --config, /input/config.json, --output, /output/run]
    volumes:
      - type: bind
        source: ${SIM_INPUT_DIR:?Set separate prepared SIM input directory}
        target: /input
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SIM_OUTPUT_DIR:?Set a NEW dedicated SIM output parent}
        target: /output
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: '2'
