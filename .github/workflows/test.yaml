name: Tests and candidate inspection (no image publication)
on:
  push:
    branches: [main, 'release/**', 'dashboard/**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      PYTEST_ADDOPTS: '-m "not genetic_execution"'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: pip install '.[test]'
      - run: ruff check src tests scripts
      - run: ruff check deploy/unraid-test
      - name: Validate every workflow with pinned Actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes=
      - name: Check standalone engine embedding, wrapper and code-bundle hashes
        run: python scripts/update_evidence_transports.py
      - name: Check code-only dashboard and offline exporter hashes
        run: python scripts/check_dashboard_hashes.py
      - name: Check separate LAN publication package code hashes
        run: python scripts/check_dashboard_lan_hashes.py
      - name: Check isolated replay worker code inventory
        run: python scripts/check_replay_worker_hashes.py
      - run: pytest -q
      - name: Independent PR22 review counterexamples must now be rejected
        env:
          PYTHONPATH: src:scripts:tests
        run: python review/pr22_contract_probe.py
      - name: Read immutable old image for read-only inspector compatibility
        run: docker pull ghcr.io/vbeinlich/eospvprognosehelfer@sha256:7e957da3e2fdb67456a46e5538ad3c74b43fa21892d2998e93bca9de83d9daf7
      - name: Verify standalone historical Doctor in the unchanged production image
        run: python scripts/doctor_container_smoke.py --docker-context default --image ghcr.io/vbeinlich/eospvprognosehelfer@sha256:7e957da3e2fdb67456a46e5538ad3c74b43fa21892d2998e93bca9de83d9daf7 --expect-no-doctor
      - name: Produce evidence through the real sync writer with a mocked optimizer response
        run: python tests/make_evidence_fixture.py --destination "$RUNNER_TEMP/evidence-compat"
      - name: Verify automatic evidence with the same standalone historical engine
        run: python scripts/evidence_container_smoke.py --docker-context default --image ghcr.io/vbeinlich/eospvprognosehelfer@sha256:7e957da3e2fdb67456a46e5538ad3c74b43fa21892d2998e93bca9de83d9daf7 --fixture "$RUNNER_TEMP/evidence-compat" --expect-no-doctor
      - name: Test old-container bundle without installed helper modules
        run: python scripts/plan_inspector_smoke.py --docker-context default --image ghcr.io/vbeinlich/eospvprognosehelfer@sha256:7e957da3e2fdb67456a46e5538ad3c74b43fa21892d2998e93bca9de83d9daf7 --html "$RUNNER_TEMP/plan-inspector-synthetic.html"
      - name: Test real static browser view without a webserver
        run: node scripts/plan_ui_smoke.mjs --browser "$(command -v google-chrome || command -v chromium)" --html "$RUNNER_TEMP/plan-inspector-synthetic.html"
      - name: Verify static EMS dashboard and last-good recovery in old image
        run: python scripts/dashboard_container_smoke.py --docker-context default --image ghcr.io/vbeinlich/eospvprognosehelfer@sha256:7e957da3e2fdb67456a46e5538ad3c74b43fa21892d2998e93bca9de83d9daf7
      - name: Generate synthetic stored dashboard events
        run: |
          python scripts/dashboard_fixture.py --destination "$RUNNER_TEMP/dashboard-source"
          mkdir "$RUNNER_TEMP/dashboard-site"
          python -m eos_pv_helper.dashboard --source "$RUNNER_TEMP/dashboard-source" --destination "$RUNNER_TEMP/dashboard-site"
      - name: Browser-check dashboard, mobile view, ranges and automatic event refresh
        run: node scripts/dashboard_ui_smoke.mjs --browser "$(command -v google-chrome || command -v chromium)" --html "$RUNNER_TEMP/dashboard-site/index.html" --expect-event --event-python python --event-source "$RUNNER_TEMP/dashboard-source"
      - name: Pull pinned isolated HTML-only server (local tests only)
        run: docker pull nginxinc/nginx-unprivileged@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
      - name: Test HTTP publication, server isolation and automatic archived-event refresh
        run: |
          python scripts/dashboard_fixture.py --destination "$RUNNER_TEMP/dashboard-http-source"
          mkdir "$RUNNER_TEMP/dashboard-http-site"
          python -m eos_pv_helper.dashboard --source "$RUNNER_TEMP/dashboard-http-source" --destination "$RUNNER_TEMP/dashboard-http-site"
          node scripts/dashboard_http_smoke.mjs --browser "$(command -v google-chrome || command -v chromium)" \
            --html "$RUNNER_TEMP/dashboard-http-site/index.html" --event-python python --event-source "$RUNNER_TEMP/dashboard-http-source"
      - run: docker compose config --no-path-resolution
      - run: docker build --target eos-source -t eos-pv-helper:ci .
      - run: python scripts/unraid_smoke.py --image eos-pv-helper:ci
      - name: Export candidate license inventory for review
        run: |
          docker run --rm --network none --entrypoint cat eos-pv-helper:ci /usr/share/eos-pv-helper/licenses/inventory.json > candidate-license-inventory.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-license-inventory-${{ github.sha }}
          path: candidate-license-inventory.json
  eos-integration:
    runs-on: ubuntu-latest
    env:
      PYTEST_ADDOPTS: '-m "not genetic_execution"'
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: docker build -f tests/integration/Dockerfile -t eos-pv-helper:eos-test .
      - run: docker run --rm --network none -e PYTEST_ADDOPTS eos-pv-helper:eos-test
      - name: Manual installer simulation in disposable tmpfs with no Docker socket
        run: |
          docker run --rm --network none --read-only --user 0:0 --cap-drop=ALL \
            --cap-add=CHOWN --cap-add=DAC_OVERRIDE --cap-add=FOWNER --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=256m,mode=1777 \
            --tmpfs /mnt:rw,nosuid,nodev,size=64m --tmpfs /app:rw,nosuid,nodev,size=16m \
            --tmpfs /output:rw,nosuid,nodev,size=16m --tmpfs /run/secrets:rw,nosuid,nodev,size=1m \
            --tmpfs /var/lock:rw,nosuid,nodev,size=1m \
            --mount type=bind,source="$PWD",target=/review,readonly \
            -e EMS_INSTALL_SIMULATION_ONLY=1 -e PYTHONPATH=/review/src:/review/scripts:/review/tests:/opt/eos/src \
            --workdir /review --entrypoint python eos-pv-helper:eos-test \
            -m pytest -q -p no:cacheprovider tests/test_unraid_install_simulation.py tests/test_unraid_test_prepare.py
      - name: Non-root read-only writer, shared contract and pipeline regression gate
        run: |
          docker run --rm --network none --read-only --user 10001:10001 --cap-drop=ALL \
            --security-opt=no-new-privileges --tmpfs /tmp:rw,exec,nosuid,nodev,mode=1777 \
            --tmpfs /tmp/eos-test:rw,nosuid,nodev,mode=1777 -e PYTEST_ADDOPTS \
            eos-pv-helper:eos-test -q -p no:cacheprovider \
            tests/test_binding_contract.py tests/test_evidence.py tests/integration/test_ems_pipeline.py tests/test_dashboard.py tests/test_dashboard_wrapper.py tests/integration/test_dashboard_cached.py tests/test_replay_contract.py tests/test_replay_wrapper.py tests/integration/test_replay_export.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Native forward comparison only, read-only sources and isolated temporary configuration
        run: |
          set -o noclobber
          docker run --rm --network none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --tmpfs /tmp:rw,exec,nosuid,nodev \
            --tmpfs /tmp/eos-test:rw,nosuid,nodev \
            --entrypoint python eos-pv-helper:eos-test \
            scripts/economics_smoke.py --html - > "$RUNNER_TEMP/economics-synthetic.html"
      - name: Browser-check calculated economics, slot costs and end-SoC fairness
        run: node scripts/plan_ui_smoke.mjs --browser "$(command -v google-chrome || command -v chromium)" --html "$RUNNER_TEMP/economics-synthetic.html" --economic
      - name: Produce synthetic native replay time cases without optimizer search
        run: |
          mkdir "$RUNNER_TEMP/replay-time-cases"
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" --cap-drop=ALL \
            --security-opt=no-new-privileges --tmpfs /tmp:rw,exec,nosuid,nodev,mode=1777 \
            --mount type=bind,source="$RUNNER_TEMP/replay-time-cases",target=/audit \
            --entrypoint python eos-pv-helper:eos-test \
            scripts/replay_time_cases.py --destination /audit/cases
      - name: Browser-check native replay, DST, internal cycles, missing data and 1000+1000 Wh stack
        run: |
          for replay_case in spring-900 autumn-900 spring-3600 autumn-3600; do
            node scripts/replay_ui_smoke.mjs --browser "$(command -v google-chrome || command -v chromium)" \
              --html "$RUNNER_TEMP/replay-time-cases/cases/$replay_case/site/index.html" \
              --sidecar "$RUNNER_TEMP/replay-time-cases/cases/$replay_case/replays.json" --stack-regression
          done
      - name: Test native replay UI through the isolated HTTP server
        run: |
          docker pull nginxinc/nginx-unprivileged@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
          node scripts/dashboard_http_smoke.mjs --browser "$(command -v google-chrome || command -v chromium)" \
            --html "$RUNNER_TEMP/replay-time-cases/cases/autumn-900/site/index.html" \
            --sidecar "$RUNNER_TEMP/replay-time-cases/cases/autumn-900/replays.json"
  replay-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTEST_ADDOPTS: '-m "not genetic_execution"'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build separate pinned native worker and synthetic test image
        run: |
          docker build -f replay-worker/Dockerfile --target test -t ems-replay-worker:test .
          docker build -f replay-worker/Dockerfile --target runtime -t ems-replay-worker:review .
      - name: Admission, recovery, races, actual native replay and timeouts
        run: |
          docker run --rm --network none --read-only --user 10001:10001 --cap-drop=ALL \
            --security-opt=no-new-privileges --cpus=1 --memory=768m --memory-swap=768m \
            --pids-limit=128 --tmpfs /tmp:rw,exec,nosuid,nodev,size=256m,mode=1777 -e PYTEST_ADDOPTS \
            ems-replay-worker:test -q -p no:cacheprovider \
            tests/test_replay_worker.py tests/test_replay_worker_deployment.py \
            tests/integration/test_replay_worker_native.py
      - name: Inspect actual offline worker boundary and measure synthetic resources
        run: |
          python scripts/replay_worker_container_smoke.py \
            --image ems-replay-worker:review --fixture-image ems-replay-worker:test \
            --report "$RUNNER_TEMP/replay-worker-resources.json"
      - name: Writer admission, real process crashes and native sync-to-dashboard pipeline
        run: |
          docker run --rm --network none --read-only --user 10001:10001 --cap-drop=ALL \
            --security-opt=no-new-privileges --cpus=1 --memory=768m --memory-swap=768m \
            --pids-limit=128 --tmpfs /tmp:rw,exec,nosuid,nodev,size=256m,mode=1777 -e PYTEST_ADDOPTS \
            ems-replay-worker:test -q -p no:cacheprovider \
            tests/test_evidence_writer.py tests/integration/test_evidence_writer_native.py
      - name: Build separately reviewed helper candidate without publishing
        run: docker build --target evidence-candidate -t eos-pv-helper:evidence-candidate .
      - name: Packaged helper writer to separate read-only native worker and dashboard
        run: |
          python scripts/evidence_writer_container_smoke.py \
            --helper-image eos-pv-helper:evidence-candidate --worker-image ems-replay-worker:review \
            --report "$RUNNER_TEMP/evidence-writer-pipeline.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-writer-pipeline-${{ github.sha }}
          path: ${{ runner.temp }}/evidence-writer-pipeline.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: replay-worker-synthetic-resources-${{ github.sha }}
          path: ${{ runner.temp }}/replay-worker-resources.json
